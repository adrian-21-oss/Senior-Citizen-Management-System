<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Senior | Senior Citizen System</title>
<link rel="stylesheet" href="/css/layout.css">
<style>
  .grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; align-items: start; }
  .card.pad { padding: 22px; } h2 { margin: 0 0 14px; font-size: 15px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; font-weight: 600; }
  input, select, textarea { width: 100%; margin-top: 5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--row); }
  input { height: 42px; padding-top: 0; padding-bottom: 0; } input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); background: #fff; }
  .invalid { border-color: var(--red-ink); } .foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .msg { flex: 1; font-size: 12px; color: var(--muted); } .msg.err { color: var(--red-ink); } .msg.ok { color: var(--green-ink); }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); } .btn.ghost:hover:not(:disabled) { background: var(--row); }
  
  /* Restored YOUR original layout structure, just with the dark background */
  .fp { height: 190px; margin: 14px 0; border-radius: 14px; display: grid; place-items: center; background: #0f1117 !important; border: 1px solid #1e293b; }
  .fp svg { width: 140px; height: 140px; overflow: visible; }
  
  /* The new animations */
  .fp.scanning .ring-pulse { animation: pulse-ring 2s ease-in-out infinite; transform-origin: 80px 80px; }
  .fp.scanning .ring-pulse-2 { animation: pulse-ring 2s ease-in-out infinite 0.6s; transform-origin: 80px 80px; }
  @keyframes pulse-ring { 0% { opacity: 0.9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.3); } }
  
  .fp.error .shake { animation: shake 0.5s ease-in-out 0.2s both; transform-origin: 80px 80px; }
  @keyframes shake { 0%, 100% { transform: rotate(0deg); } 20%, 60% { transform: rotate(-6deg); } 40%, 80% { transform: rotate(6deg); } }
  
  .fp.done .check-draw { stroke-dasharray: 28; stroke-dashoffset: 28; animation: draw-check 0.45s ease-out 0.3s forwards; }
  @keyframes draw-check { to { stroke-dashoffset: 0; } }

  /* Kept your original bottom tags intact */
  .status { padding: 10px 12px; border-radius: 10px; background: var(--row); font-size: 13px; margin-bottom: 12px; }
  .status.done { background: var(--green-bg); color: var(--green-ink); } .muted { color: var(--muted); font-size: 13px; margin: 0; }
  @media (max-width: 900px) { .grid, .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="register" data-title="Register Senior" data-subtitle="Create a new senior profile and capture biometric enrollment.">
<main>
  <div class="grid">
    <form class="card pad" id="form" novalidate>
      <h2>Senior Registration</h2>
      <div class="fields">
        <label>First name<input name="first_name" required></label>
        <label>Middle name<input name="middle_name"></label>
        <label>Last name<input name="last_name" required></label>
        <label>Sex<select name="sex" required><option value="">Select sex</option><option>Female</option><option>Male</option></select></label>
        <label>Date of birth<input type="date" name="date_of_birth" required></label>
        <label>Civil status<select name="civil_status" required><option value="">Select civil status</option><option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option></select></label>
        <label>Mobile number (optional)<input name="mobile_number" inputmode="numeric" maxlength="11" placeholder="09XXXXXXXXX"></label>
        <label>Email (optional)<input type="email" name="email"></label>
        <label class="full">Street address<input name="street_address" required></label>
        <label>Barangay<input name="barangay" required></label>
        <label>City / municipality<input name="city_municipality" required></label>
        <label>National ID / OSCA ID (optional)<input name="national_id"></label>
        <label>Emergency contact<input name="emergency_contact" required></label>
        <label class="full">Relationship (optional)<input name="emergency_relationship" placeholder="e.g. Daughter"></label>
        <label class="full">Notes (optional)<textarea name="notes" rows="3"></textarea></label>
      </div>
      
      <!-- ENROLL FINGERPRINT -->
      <div class="foot">
        <span class="msg" id="msg">Save the profile first, then capture the fingerprint.</span>
        <button type="reset" class="btn ghost" id="cancel">Cancel</button>
        <button class="btn" id="save">Save</button>
      </div>
    </form>
    <aside class="card pad">
      <h2>Biometric Enrollment</h2>
      <p class="muted">Capture the fingerprint after the profile has been saved.</p>
      <div class="fp" id="fp"><svg viewBox="0 0 160 160" fill="none"><circle cx="80" cy="80" r="4" fill="#94a3b8"/><path d="M 68 80 Q 68 66 80 66 Q 92 66 92 80 Q 92 94 80 94 Q 68 94 68 80" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 58 80 Q 58 56 80 56 Q 102 56 102 80 Q 102 104 80 104 Q 58 104 58 80" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 50 88 Q 48 48 80 48 Q 112 48 112 80 Q 112 112 80 112 Q 62 112 52 100" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 43 96 Q 38 38 80 38 Q 124 38 124 80 Q 124 120 90 128 Q 72 132 58 122" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 37 104 Q 28 28 80 28 Q 134 28 134 80 Q 134 128 96 138 Q 74 144 52 134 Q 38 126 34 110" stroke="#94a3b8" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M 32 112 Q 20 18 80 18 Q 142 18 142 80 Q 142 136 104 148 Q 80 155 58 146 Q 36 136 28 116" stroke="#7c8fa3" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
      <div class="status" id="status">Waiting for a saved profile</div>
      <button class="btn" id="scan" style="width:100%" disabled>Initiate Fingerprint Scan</button>
    </aside>
  </div>
</main>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
  Auth.hookLogout();
  const $ = id => document.getElementById(id), form = $('form');
  const REQUIRED = ['first_name', 'last_name', 'sex', 'date_of_birth', 'civil_status', 'street_address', 'barangay', 'city_municipality', 'emergency_contact'];
  let savedId = null;
  const msg = (t, cls = '') => { $('msg').textContent = t; $('msg').className = 'msg ' + cls; };
  const fp = (state, text) => { 
    $('fp').className = 'fp ' + state; 
    $('status').className = 'status ' + (state === 'done' ? 'done' : (state === 'error' ? 'err' : '')); 
    $('status').textContent = text; 
    
    if (state === 'scanning') {
      $('fp').innerHTML = `<svg viewBox="0 0 160 160" fill="none"><circle class="ring-pulse" cx="80" cy="80" r="70" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/><circle class="ring-pulse-2" cx="80" cy="80" r="70" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/><circle cx="80" cy="80" r="66" stroke="#1e4a6b" stroke-width="1" fill="none"/><circle cx="80" cy="80" r="4" fill="#38bdf8"/><path d="M 68 80 Q 68 66 80 66 Q 92 66 92 80 Q 92 94 80 94 Q 68 94 68 80" stroke="#38bdf8" stroke-width="2.2" fill="none"/><path d="M 58 80 Q 58 56 80 56 Q 102 56 102 80 Q 102 104 80 104 Q 58 104 58 80" stroke="#38bdf8" stroke-width="2.2" fill="none"/><path d="M 50 88 Q 48 48 80 48 Q 112 48 112 80 Q 112 112 80 112 Q 62 112 52 100" stroke="#38bdf8" stroke-width="2.2" fill="none"/><path d="M 43 96 Q 38 38 80 38 Q 124 38 124 80 Q 124 120 90 128 Q 72 132 58 122" stroke="#38bdf8" stroke-width="2.2" fill="none"/><path d="M 37 104 Q 28 28 80 28 Q 134 28 134 80 Q 134 128 96 138 Q 74 144 52 134 Q 38 126 34 110" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M 32 112 Q 20 18 80 18 Q 142 18 142 80 Q 142 136 104 148 Q 80 155 58 146 Q 36 136 28 116" stroke="#0ea5e9" stroke-width="2" fill="none"/></svg>`;
    } else if (state === 'done') {
      $('fp').innerHTML = `<svg viewBox="0 0 160 160" fill="none"><circle cx="80" cy="80" r="4" fill="#4ade80"/><path d="M 68 80 Q 68 66 80 66 Q 92 66 92 80 Q 92 94 80 94 Q 68 94 68 80" stroke="#4ade80" stroke-width="2.2" fill="none"/><path d="M 58 80 Q 58 56 80 56 Q 102 56 102 80 Q 102 104 80 104 Q 58 104 58 80" stroke="#4ade80" stroke-width="2.2" fill="none"/><path d="M 50 88 Q 48 48 80 48 Q 112 48 112 80 Q 112 112 80 112 Q 62 112 52 100" stroke="#4ade80" stroke-width="2.2" fill="none"/><path d="M 43 96 Q 38 38 80 38 Q 124 38 124 80 Q 124 120 90 128 Q 72 132 58 122" stroke="#4ade80" stroke-width="2.2" fill="none"/><path d="M 37 104 Q 28 28 80 28 Q 134 28 134 80 Q 134 128 96 138 Q 74 144 52 134 Q 38 126 34 110" stroke="#4ade80" stroke-width="2" fill="none"/><path d="M 32 112 Q 20 18 80 18 Q 142 18 142 80 Q 142 136 104 148 Q 80 155 58 146 Q 36 136 28 116" stroke="#22c55e" stroke-width="2" fill="none"/><circle cx="118" cy="118" r="18" fill="#071a10" stroke="#4ade80" stroke-width="1.5"/><polyline class="check-draw" points="110,118 116,124 127,112" stroke="#4ade80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
    } else if (state === 'error') {
      $('fp').innerHTML = `<svg viewBox="0 0 160 160" fill="none"><g class="shake"><circle cx="80" cy="80" r="4" fill="#f87171"/><path d="M 68 80 Q 68 66 80 66 Q 92 66 92 80 Q 92 94 80 94 Q 68 94 68 80" stroke="#f87171" stroke-width="2.2" fill="none"/><path d="M 58 80 Q 58 56 80 56 Q 102 56 102 80 Q 102 104 80 104 Q 58 104 58 80" stroke="#f87171" stroke-width="2.2" fill="none"/><path d="M 50 88 Q 48 48 80 48 Q 112 48 112 80 Q 112 112 80 112 Q 62 112 52 100" stroke="#f87171" stroke-width="2.2" fill="none"/><path d="M 43 96 Q 38 38 80 38 Q 124 38 124 80 Q 124 120 90 128 Q 72 132 58 122" stroke="#f87171" stroke-width="2.2" fill="none"/><path d="M 37 104 Q 28 28 80 28 Q 134 28 134 80 Q 134 128 96 138 Q 74 144 52 134 Q 38 126 34 110" stroke="#f87171" stroke-width="2" fill="none"/><path d="M 32 112 Q 20 18 80 18 Q 142 18 142 80 Q 142 136 104 148 Q 80 155 58 146 Q 36 136 28 116" stroke="#ef4444" stroke-width="2" fill="none"/></g><circle cx="118" cy="118" r="18" fill="#1a0a0a" stroke="#f87171" stroke-width="1.5"/><line x1="111" y1="111" x2="125" y2="125" stroke="#f87171" stroke-width="2.8" stroke-linecap="round"/><line x1="125" y1="111" x2="111" y2="125" stroke="#f87171" stroke-width="2.8" stroke-linecap="round"/></svg>`;
    } else {
      $('fp').innerHTML = `<svg viewBox="0 0 160 160" fill="none"><circle cx="80" cy="80" r="4" fill="#94a3b8"/><path d="M 68 80 Q 68 66 80 66 Q 92 66 92 80 Q 92 94 80 94 Q 68 94 68 80" stroke="#94a3b8" stroke-width="2.2" fill="none"/><path d="M 58 80 Q 58 56 80 56 Q 102 56 102 80 Q 102 104 80 104 Q 58 104 58 80" stroke="#94a3b8" stroke-width="2.2" fill="none"/><path d="M 50 88 Q 48 48 80 48 Q 112 48 112 80 Q 112 112 80 112 Q 62 112 52 100" stroke="#94a3b8" stroke-width="2.2" fill="none"/><path d="M 43 96 Q 38 38 80 38 Q 124 38 124 80 Q 124 120 90 128 Q 72 132 58 122" stroke="#94a3b8" stroke-width="2.2" fill="none"/><path d="M 37 104 Q 28 28 80 28 Q 134 28 134 80 Q 134 128 96 138 Q 74 144 52 134 Q 38 126 34 110" stroke="#94a3b8" stroke-width="2" fill="none"/><path d="M 32 112 Q 20 18 80 18 Q 142 18 142 80 Q 142 136 104 148 Q 80 155 58 146 Q 36 136 28 116" stroke="#7c8fa3" stroke-width="2" fill="none"/></svg>`;
    }
  };
  const reset = () => { savedId = null; $('scan').disabled = true; $('save').disabled = false; fp('', 'Waiting for a saved profile'); msg('Save the profile first, then capture the fingerprint.'); };

  // Only Admin and Registration Staff can register seniors.
  const role = (Auth.user() || {}).role;
  if (role === 'Benefits Staff') { $('save').disabled = true; msg('Your role (Benefits Staff) cannot register seniors.', 'err'); }

  form.addEventListener('input', e => e.target.classList.remove('invalid'));
  form.addEventListener('reset', () => { form.querySelectorAll('.invalid').forEach(f => f.classList.remove('invalid')); reset(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    let ok = true;
    REQUIRED.forEach(n => { const f = form.elements[n], bad = !f.value.trim(); f.classList.toggle('invalid', bad); if (bad) ok = false; });
    if (!ok) return msg('Fill in the highlighted fields.', 'err');
    $('save').disabled = true;
    try {
      const r = await Auth.api('/seniors', { method: 'POST', body: Object.fromEntries(new FormData(form)) });
      savedId = r.senior_id; $('scan').disabled = false;
      msg(`Saved as ${savedId}. Now capture the fingerprint.`, 'ok'); 
      fp('', `Profile saved! Ready for fingerprint scan.`);
    } catch (err) { fp('error', 'Scan failed. Try again'); msg(err.message, 'err'); $('scan').disabled = false; }
  });

  // The scan is simulated until a scanner SDK is connected; the enrollment is saved for real.
  $('scan').addEventListener('click', async () => {
    if (!savedId) return;
    $('scan').disabled = true; fp('scanning', 'Scanning…');
    await new Promise(r => setTimeout(r, 1500));
    try {
      await Auth.api(`/seniors/${encodeURIComponent(savedId)}/biometric`, { method: 'POST', body: {} });
      fp('done', `Fingerprint enrolled for ${savedId}`); msg('Registration complete.', 'ok');
      setTimeout(() => { form.reset(); }, 2500);
    } catch (err) { fp('error', 'Scan failed. Try again'); msg(err.message, 'err'); $('scan').disabled = false; }
  });
</script>
</body>
</html>
