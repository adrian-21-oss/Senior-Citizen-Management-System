<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Senior Citizen System</title>
<link rel="stylesheet" href="/css/layout.css">
<style>
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 20px; }
  .metric { margin: 0; padding: 18px 20px; background: var(--row); }
  .metric span { font-size: 12px; color: var(--muted); } .metric strong { display: block; font-size: 30px; margin: 6px 0 2px; } .metric small { color: var(--muted); font-size: 12px; }
  h2 { font-size: 15px; margin: 28px 0 0; }
  .actions { margin-top: 12px; } .actions a { display: inline-flex; align-items: center; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  th { background: var(--row); color: var(--muted); font-size: 12px; } tr:last-child td { border-bottom: 0; } .card.tbl { overflow-x: auto; margin-top: 12px; }
  .bad { color: var(--red-ink); } .muted { color: var(--muted); }
</style>
</head>
<body data-page="dashboard" data-title="Dashboard" data-subtitle="Registrations, biometric enrollment and latest activity.">
<main>
  <div class="metrics">
    <div class="card metric"><span>Registered Seniors</span><strong id="m-reg">–</strong><small id="m-reg-s"></small></div>
    <div class="card metric"><span>Biometric Enrolled</span><strong id="m-bio">–</strong><small id="m-bio-s"></small></div>
    <div class="card metric"><span>Benefits Available to Claim</span><strong id="m-ben">–</strong><small>This year's unclaimed benefits</small></div>
    <div class="card metric"><span>Failed Scans Today</span><strong id="m-fail">–</strong><small>Failed enrollments</small></div>
  </div>
  <h2>Quick Actions</h2>
  <div class="actions"><a class="btn" href="/register_citizen.html">Register &amp; Enroll New Senior</a></div>
  <h2>Recent Activity</h2>
  <div class="card tbl"><table>
    <thead><tr><th>Name</th><th>Action</th><th>Result</th><th>Date</th></tr></thead>
    <tbody id="act"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
  </table></div>
</main>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
  Auth.hookLogout();
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = iso => { const d = Math.floor((Date.now() - new Date(iso)) / 864e5); return d < 1 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago'; };
  (async () => {
    try {
      const [s, a] = await Promise.all([Auth.api('/dashboard/stats'), Auth.api('/dashboard/activity')]);
      $('m-reg').textContent = s.registered.toLocaleString(); $('m-reg-s').textContent = s.newThisWeek + ' new this week';
      $('m-bio').textContent = s.enrolled.toLocaleString(); $('m-bio-s').textContent = s.enrollmentRate + '% of registered seniors';
      $('m-ben').textContent = s.benefitsPending; $('m-fail').textContent = s.failedScans;
      $('act').innerHTML = a.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.action)}</td><td class="${r.result === 'Failed' ? 'bad' : ''}">${esc(r.result)}</td><td>${when(r.at)}</td></tr>`).join('')
        || '<tr><td colspan="4" class="muted">No activity yet.</td></tr>';
    } catch (e) { $('act').innerHTML = `<tr><td colspan="4" class="bad">${esc(e.message)}</td></tr>`; }
  })();
</script>
</body>
</html>
