<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Senior Citizen System</title>
<link rel="stylesheet" href="/css/layout.css">
<style>
  body { align-items: center; justify-content: center; background: var(--navy); padding: 20px; }
  .login { width: 100%; max-width: 380px; padding: 28px; margin: 0; }
  .login h1 { margin: 0 0 4px; font-size: 22px; } .login p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 14px; }
  input { width: 100%; height: 42px; margin-top: 5px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--row); }
  input:focus { outline: 2px solid var(--blue); background: #fff; }
  .err { color: var(--red-ink); font-size: 12px; min-height: 16px; margin: 0 0 10px; } .btn { width: 100%; }
</style>
</head>
<body>
<form class="card login" id="login-form">
  <h1>Senior Citizen System</h1>
  <p>Sign in with your staff account.</p>
  <label>Username<input name="username" autocomplete="username" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="go">Sign in</button>
</form>
<script src="/js/auth.js"></script>
<script>
  if (Auth.token()) location.replace('/index.html');
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      Auth.save(await Auth.api('/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }));
      location.href = '/index.html';
    } catch (x) { err.textContent = x.message; btn.disabled = false; }
  });
</script>
</body>
</html>
